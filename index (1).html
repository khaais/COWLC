<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Weight Loss Challenge</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Schibsted+Grotesk:wght@600;700&display=swap">
<style>
/* Layout: sticky top bar (bottom tab bar on phones), one content column, cards for summary and charts, a scrolling table for the leaderboard.
   Palette: cool slate neutrals, ink accent, green for progress, blue and amber to tell men and women apart. */
:root{
  --bg:#F2F5F7; --surface:#FFFFFF; --surface-2:#E9EEF2; --line:#D8E0E6;
  --fg:#16212B; --muted:#586775; --accent:#1B2B3B; --accent-fg:#FFFFFF;
  --pos:#177A47; --pos-bg:#E1F3E8; --neg:#B4412F; --neg-bg:#F9E4DF; --warn:#8A5A00; --warn-bg:#FBEFD2;
  --men:#3569AE; --women:#D2761C; --gold:#C79A1E; --silver:#8E9AA6; --bronze:#A8693A; --focus:#2F6FDB;
  --shadow:0 1px 2px rgba(22,33,43,.06),0 6px 20px rgba(22,33,43,.04);
  --font-display:'Schibsted Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-body:'Geist',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-mono:'Geist Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F161D; --surface:#17212A; --surface-2:#1F2B36; --line:#2B3945;
    --fg:#E8EEF3; --muted:#93A3B1; --accent:#E8EEF3; --accent-fg:#0F161D;
    --pos:#4CC28A; --pos-bg:#143527; --neg:#F28B7D; --neg-bg:#3A201C; --warn:#E5B04A; --warn-bg:#3A2E12;
    --men:#6FA3E0; --women:#F0A850; --gold:#E0B63A; --silver:#A9B4BF; --bronze:#CF8D55; --focus:#7AA7FF;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.2);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F161D; --surface:#17212A; --surface-2:#1F2B36; --line:#2B3945;
  --fg:#E8EEF3; --muted:#93A3B1; --accent:#E8EEF3; --accent-fg:#0F161D;
  --pos:#4CC28A; --pos-bg:#143527; --neg:#F28B7D; --neg-bg:#3A201C; --warn:#E5B04A; --warn-bg:#3A2E12;
  --men:#6FA3E0; --women:#F0A850; --gold:#E0B63A; --silver:#A9B4BF; --bronze:#CF8D55; --focus:#7AA7FF;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.2);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--font-display);margin:0;line-height:1.15;letter-spacing:-.01em;text-wrap:balance}
h1{font-size:clamp(1.55rem,4vw,2.1rem);font-weight:700}
h2{font-size:1.2rem;font-weight:700}
h3{font-size:1rem;font-weight:600}
p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.ic{flex:none;vertical-align:middle}
.muted{color:var(--muted)} .sm{font-size:13px}
.num{text-align:right;font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--font-mono);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}

.app{max-width:1180px;margin-inline:auto;padding-inline:16px;padding-block:0 40px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;gap:16px;padding-block:12px;border-bottom:1px solid var(--line);margin-inline:-16px;padding-inline:16px}
.brand{display:flex;align-items:center;gap:10px;min-width:0;font-family:var(--font-display);font-weight:700;font-size:1.05rem}
.brand .mark{width:32px;height:32px;border-radius:9px;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;flex:none}
.brand span.t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav{display:flex;gap:4px;margin-left:auto}
.nav button{display:inline-flex;align-items:center;gap:8px;border:0;background:transparent;padding:8px 12px;border-radius:10px;color:var(--muted);font-weight:500;cursor:pointer}
.nav button:hover{background:var(--surface-2);color:var(--fg)}
.nav button[aria-current=page]{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
.daychip{margin-left:8px;white-space:nowrap}
.tabbar{display:none;position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));grid-template-columns:repeat(4,1fr);gap:4px}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:transparent;padding:6px 2px;border-radius:10px;color:var(--muted);font-size:11px;font-weight:500;cursor:pointer;min-width:0}
.tabbar button[aria-current=page]{color:var(--fg);background:var(--surface-2)}
main{display:flex;flex-direction:column;gap:18px;padding-top:20px;outline:none;min-width:0}
.banner{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-top:14px;padding:10px 14px;border-radius:12px;font-size:13.5px;background:var(--warn-bg);color:var(--fg);border:1px solid var(--line)}
.banner.warn{background:var(--neg-bg)}
.linkbtn{border:0;background:none;padding:0;text-decoration:underline;cursor:pointer;font-weight:500}

.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:var(--shadow);min-width:0}
.sec-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px;margin-bottom:14px}
.sec-head .sub{color:var(--muted);font-size:13px;margin-top:2px}
.page-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 20px}
.page-head p{color:var(--muted);margin-top:4px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:500;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.chip.pos{background:var(--pos-bg);color:var(--pos)} .chip.neg{background:var(--neg-bg);color:var(--neg)}
.chip.warn{background:var(--warn-bg);color:var(--warn)} .chip.demo{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;background:var(--warn-bg);color:var(--warn)}
.chip.cat-Normal{background:var(--pos-bg);color:var(--pos)} .chip.cat-Overweight{background:var(--warn-bg);color:var(--warn)} .chip.cat-Obesity{background:var(--neg-bg);color:var(--neg)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;flex:none}
.dot.M{background:var(--men)} .dot.F{background:var(--women)}
.pos-t{color:var(--pos)} .neg-t{color:var(--neg)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:8px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:500}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)} .btn.primary:hover{opacity:.9}
.btn.danger{color:var(--neg)}
.btn.sm{min-height:32px;padding:4px 10px;font-size:13px}
.btn.ico{min-height:32px;min-width:34px;padding:4px}
.seg{display:inline-flex;gap:2px;padding:3px;background:var(--surface-2);border-radius:11px;max-width:100%}
.seg button{border:0;background:transparent;padding:6px 14px;border-radius:8px;font-weight:500;color:var(--muted);cursor:pointer;white-space:nowrap}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
.search{position:relative;flex:1 1 220px;max-width:340px}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search input{padding-left:38px!important}

.field label{display:block;font-weight:500;font-size:13px;margin-bottom:4px}
.field input,.field select{width:100%;min-height:42px;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font:inherit}
.field input[aria-invalid=true],.field select[aria-invalid=true]{border-color:var(--neg)}
.field .hint{font-size:12.5px;color:var(--muted);margin-top:4px}
.err{color:var(--neg);font-size:12.5px;margin-top:4px}
.err:empty{display:none}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}
.check{display:flex;gap:10px;align-items:flex-start}
.check input{width:18px;height:18px;margin-top:2px}
.bmi-prev{font-size:13.5px;color:var(--muted);min-height:20px}

/* challenge progress */
.hero{display:flex;flex-direction:column;gap:14px}
.hero-top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:8px 24px}
.hero .daybig{font-family:var(--font-display);font-weight:700;font-size:clamp(1.6rem,5vw,2.3rem);line-height:1}
.track{position:relative;height:12px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.track i.fill{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:999px}
.track i.tick{position:absolute;top:0;bottom:0;width:2px;background:var(--surface);opacity:.9}
.hero-dates{display:flex;justify-content:space-between;gap:12px;font-size:13px;color:var(--muted)}

/* stats */
.grid-stats{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:16px}
.grid-leaders{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}
.grid2{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:16px;align-items:start}
.bignum{font-family:var(--font-display);font-weight:700;font-size:2.2rem;line-height:1.05;font-variant-numeric:tabular-nums}
.bignum small{font-size:1rem;font-weight:600;color:var(--muted);margin-left:2px}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:16px;margin-top:10px}
.metrics .bignum{font-size:1.8rem}
.split{display:flex;gap:18px;margin-top:10px;flex-wrap:wrap}
.split div{display:flex;align-items:center;gap:8px}
.split b{font-family:var(--font-display);font-size:1.4rem}
.leader{display:flex;flex-direction:column;gap:6px}
.linkname{border:0;background:none;padding:0;text-align:left;font-family:var(--font-display);font-weight:700;font-size:1.15rem;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.linkname:hover{text-decoration:underline}
.empty-note{padding:24px;text-align:center;color:var(--muted)}

/* leaderboard table */
.tbl-wrap{overflow-x:auto;margin-inline:-4px;padding-inline:4px}
.tbl{width:100%;border-collapse:separate;border-spacing:0;font-variant-numeric:tabular-nums}
.tbl th{font-family:var(--font-mono);font-weight:500;font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:bottom;background:var(--surface)}
.tbl th.num{text-align:right;white-space:normal}
.tbl th.num .th{flex-wrap:wrap;justify-content:flex-end;gap:0 4px;text-align:right;max-width:96px}
.tbl td{padding:10px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl tbody tr:hover td{background:var(--surface-2)}
.tbl th .th{border:0;background:none;padding:0;font:inherit;letter-spacing:inherit;text-transform:inherit;color:inherit;cursor:pointer;display:inline-flex;gap:4px;align-items:center}
.tbl th .th:hover{color:var(--fg)}
.tbl th small{display:block;text-transform:none;letter-spacing:0;font-family:var(--font-body);font-size:11px;opacity:.85;text-align:inherit}
.rankcell{display:inline-flex;align-items:center;gap:6px;font-family:var(--font-display);font-weight:700;min-width:44px}
.rankcell .medal{font-size:18px;line-height:1}
.namebtn{border:0;background:none;padding:0;cursor:pointer;font-weight:600;display:inline-flex;gap:8px;align-items:center;text-align:left}
.namebtn:hover{text-decoration:underline}
.actions{display:flex;gap:6px;justify-content:flex-end}

/* podium */
.podium{display:flex;gap:14px;align-items:flex-end;justify-content:center}
.pod{flex:1 1 0;max-width:300px;min-width:0;display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;padding:18px 14px;border-radius:16px;border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow)}
.pod.r1{min-height:210px;border-color:var(--gold)} .pod.r2{min-height:182px} .pod.r3{min-height:164px}
.pod .medal{font-size:34px;line-height:1;margin-bottom:4px}
.pod .ord{font-family:var(--font-mono);font-size:12px;letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
.pod .pname{font-family:var(--font-display);font-weight:700;font-size:1.1rem;border:0;background:none;cursor:pointer;display:inline-flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center}
.pod .pname:hover{text-decoration:underline}
.pod .pv{font-family:var(--font-display);font-weight:700;font-size:1.9rem;font-variant-numeric:tabular-nums;line-height:1.1}

/* participant cards */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.pcard{position:relative;display:flex;flex-direction:column;gap:10px;padding:16px;border-radius:14px;border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow);min-width:0}
.pcard:hover{border-color:var(--muted)}
.pcard .pname{border:0;background:none;padding:0;text-align:left;font-weight:600;font-size:1.02rem;cursor:pointer;display:inline-flex;gap:8px;align-items:center;flex-wrap:wrap}
.pcard .pname::after{content:"";position:absolute;inset:0;border-radius:14px}
.pcard .nums{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.pcard .pct{font-family:var(--font-display);font-weight:700;font-size:1.6rem;line-height:1;font-variant-numeric:tabular-nums}
.chart{width:100%;min-width:0}
.chart svg{display:block;max-width:100%;overflow:visible}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-bottom:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}

/* profile */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{padding:14px;border-radius:12px;background:var(--surface-2);display:flex;flex-direction:column;gap:4px;min-width:0}
.stat .v{font-family:var(--font-display);font-weight:700;font-size:1.5rem;font-variant-numeric:tabular-nums;line-height:1.1}
.stat .v small{font-size:.8rem;font-weight:600;color:var(--muted)}

/* admin */
.admin-tabs{display:flex;gap:4px;overflow-x:auto;padding-bottom:2px}
.sticky-note{font-size:13px;color:var(--muted)}
.wk td input{width:110px;min-height:36px;padding:4px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font:inherit}
.wk td input[aria-invalid=true]{border-color:var(--neg)}
textarea.csv{width:100%;min-height:200px;font-family:var(--font-mono);font-size:12px;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);color:var(--fg);resize:vertical}
select.plain{min-height:40px;padding:6px 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font:inherit;max-width:100%}

/* modal and toast */
.scrim{position:fixed;inset:0;z-index:60;background:rgba(10,16,22,.55);display:grid;place-items:center;padding:16px}
.modal{background:var(--surface);color:var(--fg);border-radius:16px;width:100%;max-width:560px;max-height:100%;overflow:auto;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.35);display:flex;flex-direction:column;gap:14px}
.modal .foot{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:70;background:var(--accent);color:var(--accent-fg);padding:10px 16px;border-radius:12px;font-weight:500;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.toast[hidden]{display:none}

@media (max-width:900px){.grid-stats,.grid2{grid-template-columns:minmax(0,1fr)}}
@media (max-width:720px){
  .nav{display:none}
  .tabbar{display:grid}
  .app{padding-bottom:96px}
  .card{padding:16px}
  .daychip{margin-left:auto}
  .podium{flex-direction:column;align-items:stretch}
  .pod{max-width:none;min-height:0!important;flex-direction:row;flex-wrap:wrap;justify-content:space-between;text-align:left;align-items:center;gap:6px 12px}
  .pod.r1{order:1}.pod.r2{order:2}.pod.r3{order:3}
  .toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
  .tbl th:nth-child(1),.tbl td:nth-child(1){position:sticky;left:0;z-index:1;background:var(--surface);min-width:62px}
  .tbl th:nth-child(2),.tbl td:nth-child(2){position:sticky;left:62px;z-index:1;background:var(--surface);box-shadow:1px 0 0 var(--line)}
  .tbl tbody tr:hover td:nth-child(-n+2){background:var(--surface-2)}
}
.tabbar button span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top #authBtn{margin-left:8px;flex:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="app" id="app">
  <header class="top">
    <div class="brand"><div class="mark" id="mark"></div><span class="t" id="brandName">Weight Loss Challenge</span></div>
    <nav class="nav" id="nav" aria-label="Main"></nav>
    <span class="chip daychip" id="dayChip"></span>
    <button class="btn sm" id="authBtn" data-act="authBtn" hidden></button>
  </header>
  <div id="banner"></div>
  <main id="main" tabindex="-1"></main>
</div>
<nav class="tabbar" id="tabbar" aria-label="Main"></nav>
<div id="modalRoot"></div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
(function(){
'use strict';

/*CALC-START*/
/* ---------- Pure calculation and data rules (no DOM) ---------- */
const MS_DAY=86400000;
function rnd(x,d){const f=Math.pow(10,d);const s=x<0?-1:1;const v=s*Math.round(Math.abs(x)*f+1e-6)/f;return v===0?0:v;}
function r1(x){return rnd(x,1);} function r2(x){return rnd(x,2);}
function parseISO(s){if(typeof s!=='string')return null;const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s);if(!m)return null;const y=+m[1],mo=+m[2],d=+m[3];const t=Date.UTC(y,mo-1,d);const dt=new Date(t);if(dt.getUTCFullYear()!==y||dt.getUTCMonth()!==mo-1||dt.getUTCDate()!==d)return null;return t;}
function toISO(t){return new Date(t).toISOString().slice(0,10);}
function addDays(iso,n){return toISO(parseISO(iso)+n*MS_DAY);}
function dayDiff(a,b){return Math.round((parseISO(b)-parseISO(a))/MS_DAY);}
function localToday(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function bmiRaw(w,h){return w/Math.pow(h/100,2);}
function bmi1(w,h){return r1(bmiRaw(w,h));}
function bmiCategory(b){const v=r1(b);if(v<18.5)return 'Underweight';if(v<25)return 'Normal';if(v<30)return 'Overweight';return 'Obesity';}
function num(v){if(typeof v==='number')return isFinite(v)?v:NaN;if(v==null)return NaN;const s=String(v).trim().replace(',','.');if(s==='')return NaN;return Number(s);}
function normName(s){return String(s==null?'':s).replace(/\s+/g,' ').trim();}
function uid(){return 'i'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);}

function vName(data,name,exceptId){const n=normName(name);if(!n)return 'Enter the participant’s name.';if(n.length>60)return 'Name must be 60 characters or fewer.';const k=n.toLowerCase();if(data.participants.some(p=>p.id!==exceptId&&p.name.toLowerCase()===k))return 'A participant named “'+n+'” already exists.';return null;}
function vGender(g){return (g==='M'||g==='F')?null:'Choose Men or Women.';}
function vAge(a){const v=num(a);if(isNaN(v))return 'Enter an age in years.';if(!Number.isInteger(v)||v<14||v>100)return 'Age must be a whole number between 14 and 100.';return null;}
function vHeight(h){const v=num(h);if(isNaN(v))return 'Enter a height in cm.';if(v<=0)return 'Height must be greater than zero.';if(v<100||v>250)return 'Height must be between 100 and 250 cm.';return null;}
function vWeight(w){const v=num(w);if(isNaN(v))return 'Enter a weight in kg.';if(v<=0)return 'Weight must be greater than zero.';if(v<20||v>400)return 'Weight must be between 20 and 400 kg.';return null;}
function vDate(d){const t=parseISO(d);if(t==null)return 'Enter a valid date.';if(t<parseISO('2000-01-01')||t>parseISO('2100-12-31'))return 'Date must be between 2000 and 2100.';return null;}

function measurementsOf(data,pid){return data.measurements.filter(m=>m.pid===pid).sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);}

function addParticipant(data,input,opts){
  const errors={};let e;
  if((e=vName(data,input.name)))errors.name=e;
  if((e=vGender(input.gender)))errors.gender=e;
  if((e=vAge(input.age)))errors.age=e;
  if((e=vHeight(input.heightCm)))errors.heightCm=e;
  if((e=vWeight(input.startWeight)))errors.startWeight=e;
  if((e=vDate(input.startDate)))errors.startDate=e;
  if(Object.keys(errors).length)return {ok:false,errors};
  const p={id:(opts&&opts.id)||uid(),name:normName(input.name),gender:input.gender,age:num(input.age),heightCm:r1(num(input.heightCm)),startDate:input.startDate,demo:!!(opts&&opts.demo)};
  data.participants.push(p);
  data.measurements.push({id:(opts&&opts.mid)||uid(),pid:p.id,date:p.startDate,weight:r1(num(input.startWeight)),isStart:true});
  return {ok:true,participant:p};
}
function updateParticipant(data,id,input){
  const p=data.participants.find(x=>x.id===id);if(!p)return {ok:false,errors:{_form:'Participant not found.'}};
  const errors={};let e;
  if((e=vName(data,input.name,id)))errors.name=e;
  if((e=vGender(input.gender)))errors.gender=e;
  if((e=vAge(input.age)))errors.age=e;
  if((e=vHeight(input.heightCm)))errors.heightCm=e;
  if((e=vWeight(input.startWeight)))errors.startWeight=e;
  if((e=vDate(input.startDate)))errors.startDate=e;
  if(!errors.startDate){
    const later=measurementsOf(data,id).filter(m=>!m.isStart);
    if(later.length&&input.startDate>=later[0].date)errors.startDate='Start date must be before the first later weigh-in ('+later[0].date+').';
  }
  if(Object.keys(errors).length)return {ok:false,errors};
  p.name=normName(input.name);p.gender=input.gender;p.age=num(input.age);p.heightCm=r1(num(input.heightCm));p.startDate=input.startDate;
  const sm=data.measurements.find(m=>m.pid===id&&m.isStart);
  if(sm){sm.date=input.startDate;sm.weight=r1(num(input.startWeight));}
  return {ok:true,participant:p};
}
function deleteParticipant(data,id){
  data.participants=data.participants.filter(p=>p.id!==id);
  data.measurements=data.measurements.filter(m=>m.pid!==id);
}
function checkMeasurement(data,p,date,weight,today,exceptId,isStart){
  const errors={};let e;
  if((e=vDate(date)))errors.date=e;
  else if(!isStart){
    if(date>today)errors.date='Date can’t be in the future.';
    else if(date<p.startDate)errors.date='Date can’t be before the start date ('+p.startDate+').';
    else if(data.measurements.some(m=>m.pid===p.id&&m.date===date&&m.id!==exceptId))errors.date='This participant already has a weigh-in on that date. Edit that entry instead.';
  }
  if((e=vWeight(weight)))errors.weight=e;
  return errors;
}
function addMeasurement(data,input,today){
  const p=data.participants.find(x=>x.id===input.pid);
  if(!p)return {ok:false,errors:{pid:'Choose a participant.'}};
  const errors=checkMeasurement(data,p,input.date,input.weight,today,null,false);
  if(Object.keys(errors).length)return {ok:false,errors};
  const m={id:uid(),pid:p.id,date:input.date,weight:r1(num(input.weight))};
  data.measurements.push(m);
  return {ok:true,measurement:m};
}
function updateMeasurement(data,id,input,today){
  const m=data.measurements.find(x=>x.id===id);if(!m)return {ok:false,errors:{_form:'Weigh-in not found.'}};
  const p=data.participants.find(x=>x.id===m.pid);
  const date=m.isStart?m.date:input.date;
  const errors=checkMeasurement(data,p,date,input.weight,today,id,!!m.isStart);
  if(Object.keys(errors).length)return {ok:false,errors};
  m.date=date;m.weight=r1(num(input.weight));
  if(m.isStart)p.startDate=m.date;
  return {ok:true,measurement:m};
}
function deleteMeasurement(data,id){
  const m=data.measurements.find(x=>x.id===id);if(!m)return {ok:false,error:'Weigh-in not found.'};
  if(m.isStart)return {ok:false,error:'The starting weigh-in can’t be deleted. Edit it, or remove the participant.'};
  data.measurements=data.measurements.filter(x=>x.id!==id);return {ok:true};
}
function updateChallenge(data,input){
  const errors={};let e;const n=normName(input.name);
  if(!n)errors.name='Enter a challenge name.';else if(n.length>80)errors.name='Name must be 80 characters or fewer.';
  if((e=vDate(input.startDate)))errors.startDate=e;
  if((e=vDate(input.endDate)))errors.endDate=e;
  if(!errors.startDate&&!errors.endDate){
    const d=dayDiff(input.startDate,input.endDate)+1;
    if(d<1)errors.endDate='End date must be on or after the start date.';
    else if(d>730)errors.endDate='A challenge can last at most 730 days.';
  }
  if(Object.keys(errors).length)return {ok:false,errors};
  data.challenge.name=n;data.challenge.startDate=input.startDate;data.challenge.endDate=input.endDate;
  return {ok:true};
}

function cmp(a,b){const d=b.pct-a.pct;if(Math.abs(d)>1e-9)return d;const d2=b.bmiChange-a.bmiChange;if(Math.abs(d2)>1e-9)return d2;return a.name.localeCompare(b.name);}
function tied(a,b){return Math.abs(a.pct-b.pct)<=1e-9&&Math.abs(a.bmiChange-b.bmiChange)<=1e-9;}
function assignRanks(list,key){const s=list.slice().sort(cmp);s.forEach((r,i)=>{r[key]=(i>0&&tied(s[i-1],r))?s[i-1][key]:i+1;});}
function derive(data){
  const rows=[];
  data.participants.forEach(p=>{
    const ms=measurementsOf(data,p.id);if(!ms.length)return;
    const first=ms[0],last=ms[ms.length-1];
    const sw=first.weight,cw=last.weight,lost=r1(sw-cw),pct=lost/sw*100;
    const sb=bmi1(sw,p.heightCm),cb=bmi1(cw,p.heightCm);
    const entries=ms.map((m,i)=>{
      const l=r1(sw-m.weight),days=dayDiff(first.date,m.date);
      return {id:m.id,date:m.date,isStart:!!m.isStart,days,label:i===0?'Start':(days%7===0?'Week '+(days/7):'Day '+days),weight:m.weight,lost:i===0?null:l,pct:i===0?null:l/sw*100,bmi:bmi1(m.weight,p.heightCm)};
    });
    rows.push({id:p.id,name:p.name,gender:p.gender,age:p.age,heightCm:p.heightCm,demo:!!p.demo,startDate:first.date,lastDate:last.date,count:ms.length,
      startWeight:sw,curWeight:cw,lost:lost,pct:pct,startBmi:sb,curBmi:cb,bmiChange:r1(sb-cb),startCat:bmiCategory(sb),curCat:bmiCategory(cb),entries:entries});
  });
  assignRanks(rows,'rank');
  assignRanks(rows.filter(r=>r.gender==='M'),'catRank');
  assignRanks(rows.filter(r=>r.gender==='F'),'catRank');
  rows.sort(cmp);
  return rows;
}
function mean(a){return a.length?a.reduce((s,x)=>s+x,0)/a.length:0;}
function stats(rows){
  const M=rows.filter(r=>r.gender==='M'),F=rows.filter(r=>r.gender==='F');
  const best=l=>{const s=l.slice().sort(cmp)[0];return (s&&s.pct>1e-9)?s:null;};
  const g=l=>({n:l.length,avgPct:mean(l.map(r=>r.pct)),avgLost:mean(l.map(r=>r.lost))});
  return {n:rows.length,nM:M.length,nF:F.length,avgPct:mean(rows.map(r=>r.pct)),avgLost:mean(rows.map(r=>r.lost)),avgBmi:mean(rows.map(r=>r.bmiChange)),
    leader:best(rows),bestM:best(M),bestF:best(F),gender:{M:g(M),F:g(F)}};
}
function progress(ch,today){
  const duration=dayDiff(ch.startDate,ch.endDate)+1,elapsed=dayDiff(ch.startDate,today)+1;
  let status='active';if(elapsed<1)status='upcoming';else if(elapsed>duration)status='ended';
  const day=Math.min(Math.max(elapsed,0),duration);
  return {duration,day,status,remaining:status==='upcoming'?duration:duration-day,daysUntil:status==='upcoming'?1-elapsed:0,pct:day/duration*100};
}
function niceTicks(min,max,count){
  if(!(max>min)){min=min-1;max=max+1;}
  const raw=(max-min)/count,mag=Math.pow(10,Math.floor(Math.log10(raw))),n=raw/mag;
  const step=(n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*mag;
  const lo=Math.floor(min/step+1e-9)*step,hi=Math.ceil(max/step-1e-9)*step,ticks=[];
  for(let v=lo;v<=hi+step/2;v+=step)ticks.push(+v.toFixed(6));
  return {ticks:ticks,min:ticks[0],max:ticks[ticks.length-1],step:step};
}

function buildDemo(today){

  const data={schema:1,challenge:{name:'Autumn Reset Challenge (demo)',startDate:start,endDate:addDays(start,59),demo:true},settings:{showBody:true},participants:[],measurements:[]};

function normalize(d){
  if(!d||typeof d!=='object'||!Array.isArray(d.participants)||!Array.isArray(d.measurements)||!d.challenge)return null;
  if(!d.settings)d.settings={showBody:true};
  const ids=new Set(d.participants.map(p=>p.id));
  d.measurements=d.measurements.filter(m=>ids.has(m.pid));
  d.participants=d.participants.filter(p=>d.measurements.some(m=>m.pid===p.id));
  return d;
}

function emptyNote(t){return '<div class="empty-note">'+t+'</div>';}

/* ---------- Charts (SVG, drawn after the DOM is in place) ---------- */
function chartSlot(fn){const id='ch'+pending.length;pending.push({id:id,fn:fn});return '<div class="chart" id="'+id+'"></div>';}
function drawCharts(){pending.forEach(p=>{const el=document.getElementById(p.id);if(!el)return;try{el.innerHTML=p.fn(Math.floor(el.clientWidth)||320);}catch(e){el.innerHTML='';}});}
function tickFmtFor(step){const d=Number.isInteger(step)?0:(Number.isInteger(step*10)?1:2);return v=>v.toFixed(d).replace('-','−');}
function trunc(s,n){return s.length>n?s.slice(0,Math.max(1,n-1))+'…':s;}

function barChartH(items,o,W){
  o=o||{};const rowH=o.rowH||26,barH=o.barH||14,padT=6,axisH=24;
  const labelW=o.labelW||Math.min(150,Math.round(W*0.36)),right=58;
  const vals=items.map(i=>i.value);
  const lo=Math.min.apply(null,[0].concat(vals)),hi=Math.max.apply(null,[0.5].concat(vals));
  const nt=niceTicks(lo,hi,W<420?3:5),tf=tickFmtFor(nt.step);
  const x0=labelW+10,x1=Math.max(x0+40,W-right);
  const sx=v=>x0+(v-nt.min)/(nt.max-nt.min)*(x1-x0);
  const H=padT+items.length*rowH+axisH,maxCh=Math.floor((labelW-6)/6.6);
  let s='<svg viewBox="0 0 '+W+' '+H+'" width="'+W+'" height="'+H+'" role="img" aria-label="'+esc(o.aria||'Bar chart')+'" font-family="var(--font-body)">';
  nt.ticks.forEach(t=>{const x=sx(t);s+='<line x1="'+x+'" x2="'+x+'" y1="'+padT+'" y2="'+(H-axisH)+'" style="stroke:var(--line)" stroke-width="1"/><text x="'+x+'" y="'+(H-7)+'" text-anchor="middle" font-size="11" style="fill:var(--muted)">'+tf(t)+(o.unit||'')+'</text>';});
  if(nt.min<0)s+='<line x1="'+sx(0)+'" x2="'+sx(0)+'" y1="'+padT+'" y2="'+(H-axisH)+'" style="stroke:var(--muted)" stroke-width="1.2"/>';
  items.forEach((it,i)=>{
    const cy=padT+i*rowH+rowH/2,xs=sx(0),xe=sx(it.value),bx=Math.min(xs,xe),bw=Math.max(Math.abs(xe-xs),it.value===0?0:1.5);
    s+='<g'+(it.id?' data-act="profile" data-id="'+esc(it.id)+'" style="cursor:pointer"':'')+'>';
    s+='<text x="'+labelW+'" y="'+(cy+4)+'" text-anchor="end" font-size="12" style="fill:var(--fg)">'+esc(trunc(it.label,maxCh))+'</text>';
    s+='<rect x="'+bx+'" y="'+(cy-barH/2)+'" width="'+bw+'" height="'+barH+'" rx="3" style="fill:'+it.color+'"/>';
    s+='<text x="'+(it.value>=0?xe+6:xe-6)+'" y="'+(cy+4)+'" text-anchor="'+(it.value>=0?'start':'end')+'" font-size="12" font-weight="500" style="fill:var(--fg)">'+esc((o.fmt||f2)(it.value))+'</text></g>';
  });
  return s+'</svg>';
}

function lineChart(pts,o,W){
  const H=o.H||230,L=46,R=26,T=24,B=30;
  const ts=pts.map(p=>p.t);let t0=Math.min.apply(null,ts),t1=Math.max.apply(null,ts);if(t0===t1){t0-=3*MS_DAY;t1+=3*MS_DAY;}
  const vs=pts.map(p=>p.v),vlo=Math.min.apply(null,vs),vhi=Math.max.apply(null,vs),pad=Math.max(o.minPad||0.5,(vhi-vlo)*0.25);
  const nt=niceTicks(vlo-pad,vhi+pad,4),tf=tickFmtFor(nt.step);
  const sx=t=>L+(t-t0)/(t1-t0)*(W-L-R),sy=v=>T+(1-(v-nt.min)/(nt.max-nt.min))*(H-T-B);
  const col=o.color||'var(--accent)';
  let s='<svg viewBox="0 0 '+W+' '+H+'" width="'+W+'" height="'+H+'" role="img" aria-label="'+esc(o.aria||'Line chart')+'" font-family="var(--font-body)">';
  nt.ticks.forEach(v=>{const y=sy(v);s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'" style="stroke:var(--line)" stroke-width="1"/><text x="'+(L-8)+'" y="'+(y+4)+'" text-anchor="end" font-size="11" style="fill:var(--muted)">'+tf(v)+'</text>';});
  (o.bands||[]).forEach(b=>{if(b.v>nt.min&&b.v<nt.max){const y=sy(b.v);s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'" style="stroke:var(--muted)" stroke-width="1" stroke-dasharray="4 4"/><text x="'+(W-R)+'" y="'+(y-4)+'" text-anchor="end" font-size="10.5" style="fill:var(--muted)">'+esc(b.label)+'</text>';}});
  const n=pts.length,maxT=W<420?3:W<640?4:6,idx=[];
  if(n<=maxT){for(let i=0;i<n;i++)idx.push(i);}else{for(let k=0;k<maxT;k++)idx.push(Math.round(k*(n-1)/(maxT-1)));}
  idx.forEach(i=>{s+='<text x="'+sx(pts[i].t)+'" y="'+(H-8)+'" text-anchor="middle" font-size="11" style="fill:var(--muted)">'+fmtShort(pts[i].t)+'</text>';});
  const path=pts.map((p,i)=>(i?'L':'M')+sx(p.t).toFixed(1)+' '+sy(p.v).toFixed(1)).join(' ');
  if(n>1)s+='<path d="'+path+' L'+sx(pts[n-1].t).toFixed(1)+' '+(H-B)+' L'+sx(pts[0].t).toFixed(1)+' '+(H-B)+' Z" style="fill:'+col+';opacity:.1"/>';
  if(n>1)s+='<path d="'+path+'" fill="none" style="stroke:'+col+'" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>';
  const labelAll=n<=7&&(W-L-R)/Math.max(1,n-1)>=56;
  pts.forEach((p,i)=>{
    const last=i===n-1,x=sx(p.t),y=sy(p.v);
    s+='<circle cx="'+x+'" cy="'+y+'" r="'+(last?5.5:4)+'" style="fill:'+(last?col:'var(--surface)')+';stroke:'+col+'" stroke-width="2"/>';
    const anc=n>1?(i===0?'start':last?'end':'middle'):'middle';
    if(labelAll||i===0||last)s+='<text x="'+(anc==='start'?x-3:anc==='end'?x+3:x)+'" y="'+(y-11)+'" text-anchor="'+anc+'" font-size="12" font-weight="500" style="fill:var(--fg)">'+esc(o.fmt(p.v))+'</text>';
  });
  return s+'</svg>';
}
function sparkline(vals,color){
  const W=96,H=30,n=vals.length;if(n<1)return '';
  const lo=Math.min.apply(null,vals),hi=Math.max.apply(null,vals),rg=(hi-lo)||1;
  const sx=i=>n===1?W/2:4+i*(W-8)/(n-1),sy=v=>H-5-(v-lo)/rg*(H-10);
  let s='<svg width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Weight trend">';
  if(n>1)s+='<path d="'+vals.map((v,i)=>(i?'L':'M')+sx(i).toFixed(1)+' '+sy(v).toFixed(1)).join(' ')+'" fill="none" style="stroke:'+color+'" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>';
  return s+'<circle cx="'+sx(n-1)+'" cy="'+sy(vals[n-1])+'" r="3.2" style="fill:'+color+'"/></svg>';
}
const gcolor=g=>g==='M'?'var(--men)':'var(--women)';

/* ---------- Shared view pieces ---------- */
function tabsHtml(){
  return '<div class="seg" role="group" aria-label="Leaderboard category">'+[['overall','Overall'],['M','Men'],['F','Women']].map(t=>'<button data-act="tab" data-tab="'+t[0]+'" aria-pressed="'+(ui.tab===t[0])+'">'+t[1]+'</button>').join('')+'</div>';
}
function lbTable(list){
  const cols=[['rank','Rank',0,''],['name','Participant',0,''],['gender','Gender',0,''],['startWeight','Starting weight',1,'kg'],['curWeight','Current weight',1,'kg'],['lost','Weight lost',1,'kg'],['pct','Loss %',1,''],['startBmi','Starting BMI',1,''],['curBmi','Current BMI',1,''],['bmiChange','BMI change',1,'']];
  const head=cols.map(c=>{
    const act=ui.sort.key===c[0];
    return '<th scope="col" class="'+(c[2]?'num':'')+'" aria-sort="'+(act?(ui.sort.dir==='asc'?'ascending':'descending'):'none')+'"><button class="th" data-act="sort" data-key="'+c[0]+'">'+c[1]+(c[3]?'<small>'+c[3]+'</small>':'')+(act?icon(ui.sort.dir==='asc'?'up':'down',12):icon('sort',12))+'</button></th>';
  }).join('');
  const body=list.map(r=>{
    const rk=rankOf(r),m=medal(rk);
    return '<tr><td><span class="rankcell">'+(m?'<span class="medal" aria-hidden="true">'+m+'</span>':'')+'<span>'+rk+'</span></span></td>'+
      '<td><button class="namebtn" data-act="profile" data-id="'+esc(r.id)+'">'+esc(r.name)+'</button> '+demoChip(r)+'</td>'+
      '<td><span class="dot '+r.gender+'"></span> '+(r.gender==='M'?'Male':'Female')+'</td>'+
      '<td class="num">'+f1(r.startWeight)+'</td><td class="num">'+f1(r.curWeight)+'</td><td class="num">'+signedNum(r.lost,1)+'</td>'+
      '<td class="num">'+lossChip(r.pct)+'</td><td class="num">'+f1(r.startBmi)+'</td><td class="num">'+f1(r.curBmi)+'</td><td class="num">'+signedNum(r.bmiChange,1)+'</td></tr>';
  }).join('');
  return '<div class="tbl-wrap"><table class="tbl"><caption class="sr" style="position:absolute;left:-9999px">Leaderboard ranked by weight loss percentage</caption><thead><tr>'+head+'</tr></thead><tbody>'+(body||'<tr><td colspan="10">'+emptyNote('No participants match.')+'</td></tr>')+'</tbody></table></div>';
}
function leaderCard(label,r){
  if(!r)return '<div class="card leader"><div class="eyebrow">'+label+'</div><div class="bignum muted">—</div><div class="muted sm">No leader yet. This fills in after the first recorded loss.</div></div>';
  return '<div class="card leader"><div class="eyebrow">'+label+'</div><button class="linkname" data-act="profile" data-id="'+esc(r.id)+'"><span class="dot '+r.gender+'"></span>'+esc(r.name)+'</button>'+
    '<div class="bignum pos-t">'+f2(r.pct)+'<small>%</small></div><div class="muted sm">'+f1(r.lost)+' kg lost · BMI '+f1(r.startBmi)+' to '+f1(r.curBmi)+'</div></div>';
}
function progressCard(){
  const p=D.pr,c=data.challenge;
  let big,side;
  if(p.status==='upcoming'){big='Starts in '+plural(p.daysUntil,'day');side=plural(p.duration,'day')+' long';}
  else if(p.status==='ended'){big='Challenge complete';side=plural(p.duration,'day')+' ran';}
  else{big='Day '+p.day+' of '+p.duration;side=plural(p.remaining,'day')+' remaining';}
  let ticks='';for(let d=7;d<p.duration;d+=7)ticks+='<i class="tick" style="left:'+(d/p.duration*100)+'%"></i>';
  return '<section class="card hero" aria-label="Challenge progress"><div class="hero-top"><div><div class="eyebrow">'+icon('calendar',13)+' '+esc(c.name)+'</div><div class="daybig">'+big+'</div></div><div class="chip" style="font-size:13px;padding:4px 12px">'+side+'</div></div>'+
    '<div class="track" role="progressbar" aria-valuemin="0" aria-valuemax="'+p.duration+'" aria-valuenow="'+p.day+'" aria-label="Challenge progress"><i class="fill" style="width:'+p.pct+'%"></i>'+ticks+'</div>'+
    '<div class="hero-dates"><span>Starts '+fmtDate(c.startDate)+'</span><span>Weekly weigh-ins marked on the bar</span><span>Ends '+fmtDate(c.endDate)+'</span></div></section>';
}
function overallChartCard(){
  const items=D.rows.map(r=>({id:r.id,label:r.name,value:r2(r.pct),color:gcolor(r.gender)}));
  return '<section class="card"><div class="sec-head"><div><h2>Weight loss by participant</h2><div class="sub">Loss as a percent of starting weight, highest first.</div></div></div>'+
    '<div class="legend"><span><i class="dot M"></i>Men</span><span><i class="dot F"></i>Women</span></div>'+
    (items.length?chartSlot(W=>barChartH(items,{fmt:v=>v.toFixed(2)+'%',unit:'%',aria:'Weight loss percent for each participant'},W)):emptyNote('Add participants to see the chart.'))+'</section>';
}
function genderChartCard(){
  const g=D.st.gender;
  const items=[{label:'Men',value:r2(g.M.avgPct),color:'var(--men)'},{label:'Women',value:r2(g.F.avgPct),color:'var(--women)'}];
  const line=(k,name)=>'<div class="row" style="justify-content:space-between"><span><i class="dot '+k+'"></i> '+name+' ('+g[k].n+')</span><span class="muted">avg '+f1(g[k].avgLost)+' kg lost</span></div>';
  return '<section class="card"><div class="sec-head"><div><h2>Average loss by group</h2><div class="sub">Mean loss % for men and for women.</div></div></div>'+
    chartSlot(W=>barChartH(items,{rowH:46,barH:24,labelW:62,fmt:v=>v.toFixed(2)+'%',unit:'%',aria:'Average weight loss percent for men and women'},W))+
    '<div style="display:flex;flex-direction:column;gap:6px;margin-top:10px;font-size:14px">'+line('M','Men')+line('F','Women')+'</div></section>';
}

/* ---------- Views ---------- */
function viewDashboard(){
  const st=D.st,list=sortList(tabRows());
  const shown=(ui.showAll||list.length<=12)?list:list.slice(0,10);
  const more=list.length>12?'<button class="btn sm" data-act="showAll">'+(ui.showAll?'Show top 10':'Show all '+list.length)+'</button>':'';
  return progressCard()+myStrip()+
  '<div class="grid-stats"><section class="card"><div class="eyebrow">Participants</div><div class="bignum">'+st.n+'</div><div class="split"><div><i class="dot M"></i><b>'+st.nM+'</b> men</div><div><i class="dot F"></i><b>'+st.nF+'</b> women</div></div></section>'+
  '<section class="card"><div class="eyebrow">Group average</div><div class="metrics"><div><div class="bignum pos-t">'+f2(st.avgPct)+'<small>%</small></div><div class="muted sm">weight loss</div></div><div><div class="bignum">'+f1(st.avgLost)+'<small>kg</small></div><div class="muted sm">weight lost</div></div><div><div class="bignum">'+f1(st.avgBmi)+'</div><div class="muted sm">BMI change</div></div></div></section></div>'+
  '<div class="grid-leaders">'+leaderCard('Current leader',st.leader)+leaderCard('Best man',st.bestM)+leaderCard('Best woman',st.bestF)+'</div>'+
  '<section class="card"><div class="sec-head"><div><h2>Leaderboard</h2><div class="sub">Ranked by weight loss %, ties broken by BMI reduction.</div></div><div class="row">'+tabsHtml()+'</div></div>'+lbTable(shown)+
  '<div class="row" style="margin-top:12px;justify-content:space-between"><button class="btn sm" data-act="nav" data-view="leaderboard">'+icon('trophy',15)+' Open leaderboard</button>'+more+'</div></section>'+
  '<div class="grid2">'+overallChartCard()+genderChartCard()+'</div>';
}
function podiumHtml(){
  const base=tabRows().filter(r=>r.pct>1e-9&&rankOf(r)<=3).sort((a,b)=>(rankOf(a)-rankOf(b))||cmp(a,b));
  if(!base.length)return '<div class="card">'+emptyNote('No weight loss recorded yet. The podium fills in after the first weigh-in shows a loss.')+'</div>';
  let l=base;
  if(l.length===3&&rankOf(l[0])===1&&rankOf(l[1])===2&&rankOf(l[2])===3)l=[l[1],l[0],l[2]];
  return '<div class="podium">'+l.map(r=>{const k=rankOf(r);return '<article class="pod r'+k+'"><span class="medal" aria-hidden="true">'+medal(k)+'</span><span class="ord">'+ordinal(k)+'</span>'+
    '<button class="pname" data-act="profile" data-id="'+esc(r.id)+'"><span class="dot '+r.gender+'"></span>'+esc(r.name)+' '+demoChip(r)+'</button>'+
    '<div class="pv pos-t">'+f2(r.pct)+'%</div><div class="muted sm">'+f1(r.lost)+' kg · BMI −'+f1(r.bmiChange).replace('−','')+'</div></article>';}).join('')+'</div>';
}
function lbResults(){
  const q=ui.q.trim().toLowerCase();
  let list=tabRows();if(q)list=list.filter(r=>r.name.toLowerCase().includes(q));
  return lbTable(sortList(list));
}
function viewLeaderboard(){
  return '<div class="page-head"><div><h1>Leaderboard</h1><p>Updates automatically after every weigh-in.</p></div>'+(isAdmin()?'<div class="row"><button class="btn" data-act="export">'+icon('download',16)+' Export CSV</button></div>':'')+'</div>'+
  '<div class="row">'+tabsHtml()+'</div>'+podiumHtml()+
  '<section class="card"><div class="sec-head"><h2>Full standings</h2><div class="search">'+icon('search',16)+'<div class="field"><input id="q" type="search" placeholder="Search participants" aria-label="Search participants" value="'+esc(ui.q)+'"></div></div></div><div id="results">'+lbResults()+'</div></section>';
}
function pcards(){
  const q=ui.q.trim().toLowerCase();
  let l=D.rows.slice();
  if(ui.pgender!=='all')l=l.filter(r=>r.gender===ui.pgender);
  if(q)l=l.filter(r=>r.name.toLowerCase().includes(q));
  if(!l.length)return emptyNote('No participants match.');
  return '<div class="pgrid">'+l.map(r=>
    '<article class="pcard"><div class="row" style="justify-content:space-between;flex-wrap:nowrap"><button class="pname" data-act="profile" data-id="'+esc(r.id)+'"><span class="dot '+r.gender+'"></span>'+esc(r.name)+' '+demoChip(r)+'</button></div>'+
    '<div class="row"><span class="chip">Overall #'+r.rank+'</span><span class="chip">'+genderName(r.gender)+' #'+r.catRank+'</span></div>'+
    '<div class="nums"><div><div class="pct '+(r2(r.pct)>0?'pos-t':'')+'">'+f2(r.pct)+'%</div><div class="muted sm">'+f1(r.lost)+' kg lost</div></div>'+sparkline(r.entries.map(e=>e.weight),gcolor(r.gender))+'</div>'+
    '<div class="muted sm">'+f1(r.startWeight)+' kg to '+f1(r.curWeight)+' kg</div></article>').join('')+'</div>';
}
function viewParticipants(){
  return '<div class="page-head"><div><h1>Participants</h1><p>Select a participant to see progress and charts.</p></div></div>'+
  '<div class="row"><div class="seg" role="group" aria-label="Filter by gender">'+[['all','Everyone'],['M','Men'],['F','Women']].map(t=>'<button data-act="pgender" data-g="'+t[0]+'" aria-pressed="'+(ui.pgender===t[0])+'">'+t[1]+'</button>').join('')+'</div>'+
  '<div class="search">'+icon('search',16)+'<div class="field"><input id="q" type="search" placeholder="Search participants" aria-label="Search participants" value="'+esc(ui.q)+'"></div></div></div>'+
  '<div id="results">'+pcards()+'</div>';
}
function profileBody(r){
  const col=gcolor(r.gender);
  const body=data.settings.showBody?'<div class="stat"><div class="eyebrow">Age</div><div class="v">'+r.age+'<small> yrs</small></div></div><div class="stat"><div class="eyebrow">Height</div><div class="v">'+f1(r.heightCm).replace(/\.0$/,'')+'<small> cm</small></div></div>':'';
  const trows=r.entries.map(e=>'<tr><td>'+fmtDate(e.date)+'</td><td>'+e.label+'</td><td class="num">'+f1(e.weight)+'</td><td class="num">'+(e.lost==null?'<span class="muted">–</span>':signedNum(e.lost,1))+'</td><td class="num">'+(e.pct==null?'<span class="muted">–</span>':lossChip(e.pct))+'</td><td class="num">'+f1(e.bmi)+'</td></tr>').join('');
  const ptsW=r.entries.map(e=>({t:parseISO(e.date),v:e.weight})),ptsB=r.entries.map(e=>({t:parseISO(e.date),v:e.bmi}));
  return '<div class="stat-grid">'+
  '<div class="stat"><div class="eyebrow">Starting weight</div><div class="v">'+f1(r.startWeight)+'<small> kg</small></div></div>'+
  '<div class="stat"><div class="eyebrow">Current weight</div><div class="v">'+f1(r.curWeight)+'<small> kg</small></div></div>'+
  '<div class="stat"><div class="eyebrow">Total weight lost</div><div class="v">'+signedNum(r.lost,1)+'<small> kg</small></div></div>'+
  '<div class="stat"><div class="eyebrow">Weight loss</div><div class="v">'+lossChip(r.pct)+'</div></div>'+
  '<div class="stat"><div class="eyebrow">Starting BMI</div><div class="v">'+f1(r.startBmi)+'</div>'+catChip(r.startCat)+'</div>'+
  '<div class="stat"><div class="eyebrow">Current BMI</div><div class="v">'+f1(r.curBmi)+'</div>'+catChip(r.curCat)+'</div>'+
  '<div class="stat"><div class="eyebrow">BMI change</div><div class="v">'+signedNum(r.bmiChange,1)+'</div></div>'+body+'</div>'+
  '<div class="grid2" style="grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))"><section class="card"><div class="sec-head"><h2>Weight (kg)</h2></div>'+chartSlot(W=>lineChart(ptsW,{color:col,fmt:v=>v.toFixed(1),aria:'Weight in kilograms over time for '+r.name},W))+'</section>'+
  '<section class="card"><div class="sec-head"><h2>BMI</h2></div>'+chartSlot(W=>lineChart(ptsB,{color:col,fmt:v=>v.toFixed(1),minPad:0.4,bands:[{v:18.5,label:'Normal from 18.5'},{v:25,label:'Overweight from 25'},{v:30,label:'Obesity from 30'}],aria:'BMI over time for '+r.name},W))+'</section></div>'+
  '<section class="card"><div class="sec-head"><h2>Weigh-ins</h2></div><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Date</th><th>Label</th><th class="num">Weight<small>kg</small></th><th class="num">Weight lost<small>kg</small></th><th class="num">Loss %</th><th class="num">BMI</th></tr></thead><tbody>'+trows+'</tbody></table></div></section>';
}
function viewProfile(){
  const r=D.rows.find(x=>x.id===ui.pid);
  if(!r){ui.view='participants';return viewParticipants();}
  const nCat=r.gender==='M'?D.st.nM:D.st.nF;

function placeLine(r){
  const i=D.rows.findIndex(x=>x.id===r.id),ahead=D.rows[i-1],behind=D.rows[i+1];

  if(ahead)return 'You’re level with the place above you. BMI reduction breaks ties.';
  if(behind&&r.pct-behind.pct>0.005)return 'You’re in front by '+f2(r.pct-behind.pct)+' percentage points. Keep it up!';
  return 'You’re level at the top. BMI reduction breaks ties.';

/* ---------- Shared database connection ---------- */
function cloudInit(){
  const load=window.__WLC_LOADER||function(u){return import(u);};
  const base='https://www.gstatic.com/firebasejs/10.12.2/';
  const fail=function(m){Cloud.status='error';Cloud.msg=m||'';if(!data)render(false);else toast('Lost connection to the database.');};
  const timer=setTimeout(function(){if(Cloud.status==='loading')fail('timeout');},20000);
  Promise.all([load(base+'firebase-app.js'),load(base+'firebase-auth.js'),load(base+'firebase-firestore.js')]).then(function(m){
    const app=m[0].initializeApp(FIREBASE_CONFIG);
    Cloud.au=m[1];Cloud.fs=m[2];Cloud.auth=m[1].getAuth(app);
    Cloud.ref=m[2].doc(m[2].getFirestore(app),'challenge','main');
    m[1].onAuthStateChanged(Cloud.auth,function(u){
      Cloud.user=u||null;
      if(!isAdmin()&&ui.view==='admin')ui.view='dashboard';
      if(data)render(false);
    });
    m[2].onSnapshot(Cloud.ref,function(snap){
      if(snap.metadata&&snap.metadata.hasPendingWrites&&data)return;
      clearTimeout(timer);
      let d=null;
      if(snap.exists()){try{d=normalize(JSON.parse(snap.data().json));}catch(e){d=null;}}
      if(!d)d={schema:1,challenge:blankChallenge(localToday()),settings:{showBody:true},participants:[],measurements:[]};
      data=d;Cloud.status='ready';render(false);
    },function(err){clearTimeout(timer);fail(err&&err.code);});
  }).catch(function(){clearTimeout(timer);fail('load');});
}

function openExport(){
  const def=ui.tab==='M'?'lb-M':ui.tab==='F'?'lb-F':'lb-overall';
  const opts=[['lb-overall','Leaderboard, overall'],['lb-M','Leaderboard, men'],['lb-F','Leaderboard, women'],['participants','Participants (admin detail)'],['weighins','All weigh-ins']];
  openModal('<div class="sec-head" style="margin:0"><h2>Export CSV</h2><button class="btn ico" data-act="closeModal" aria-label="Close">'+icon('x',16)+'</button></div>'+
    '<div class="field"><label for="exSel">Data</label><select id="exSel">'+opts.map(o=>'<option value="'+o[0]+'"'+(o[0]===def?' selected':'')+'>'+o[1]+'</option>').join('')+'</select></div>'+
    '<textarea class="csv" id="exText" readonly aria-label="CSV data">'+esc(exportContent(def))+'</textarea>'+
    '<p class="muted sm">Copy the text, then paste into Excel or Google Sheets, or save it as a .csv file.</p>'+
    '<div class="foot"><button class="btn" data-act="closeModal">Close</button><button class="btn primary" data-act="copyCsv">'+icon('copy',16)+' Copy CSV</button></div>');
}
function openEditMeasurement(id){
  const m=data.measurements.find(x=>x.id===id);if(!m)return;
  const p=data.participants.find(x=>x.id===m.pid);
  openModal('<h2>Edit weigh-in</h2><p class="muted">'+esc(p.name)+(m.isStart?' · starting weight':'')+'</p>'+
    '<form id="mform" data-form="measurement" data-id="'+esc(id)+'" novalidate><div class="fgrid">'+
    fld('date','mf-date','Date','<input id="mf-date" name="date" type="date" value="'+esc(m.date)+'"'+(m.isStart?' disabled':'')+'>',m.isStart?'Change the start date from the participant form.':'')+
    fld('weight','mf-weight','Weight (kg)','<input id="mf-weight" name="weight" type="number" step="0.1" min="20" max="400" inputmode="decimal" value="'+m.weight+'">')+
    '</div><div class="err" data-err="_form"></div><div class="foot" style="margin-top:12px"><button class="btn" type="button" data-act="closeModal">Cancel</button><button class="btn primary" type="submit">Save changes</button></div></form>');
}

/* ---------- Forms ---------- */
function showErrors(form,errors){
  form.querySelectorAll('[data-err]').forEach(el=>{el.textContent='';});
  form.querySelectorAll('[aria-invalid]').forEach(el=>el.removeAttribute('aria-invalid'));
  let first=null;
  Object.keys(errors).forEach(k=>{
    const el=form.querySelector('[data-err="'+k+'"]');if(el)el.textContent=errors[k];
    const inp=form.elements[k];if(inp&&inp.setAttribute){inp.setAttribute('aria-invalid','true');if(!first)first=inp;}
  });
  if(first&&first.focus)first.focus();
}
function formValues(form){const o={};new FormData(form).forEach((v,k)=>{o[k]=v;});return o;}
const submits={
  participant(form){
    const v=formValues(form);
    const res=ui.editPid?updateParticipant(data,ui.editPid,v):addParticipant(data,v);
    if(!res.ok){showErrors(form,res.errors);return;}
    const wasEdit=!!ui.editPid;ui.editPid=null;
    commit((wasEdit?'Saved ':'Added ')+res.participant.name);
  },
  weigh(form){
    const v=formValues(form);
    const res=addMeasurement(data,{pid:v.pid,date:v.date,weight:v.weight},localToday());
    if(!res.ok){showErrors(form,res.errors);return;}
    commit('Weigh-in saved');
  },
  weekly(form){
    const v=formValues(form),today=localToday();
    ui.wkDate=v.date;ui.wkErr={};ui.wkVals={};ui.wkDateErr='';
    let e=vDate(v.date);if(!e&&v.date>today)e='Date can’t be in the future.';
    if(e){ui.wkDateErr=e;Object.keys(v).forEach(k=>{if(k!=='date'&&String(v[k]).trim()!=='')ui.wkVals[k]=v[k];});render(false);return;}
    let saved=0,failed=0;
    data.participants.forEach(p=>{
      const raw=v[p.id];if(raw==null||String(raw).trim()==='')return;
      const res=addMeasurement(data,{pid:p.id,date:v.date,weight:raw},today);
      if(res.ok)saved++;else{failed++;ui.wkErr[p.id]=Object.keys(res.errors).map(k=>res.errors[k])[0];ui.wkVals[p.id]=raw;}
    });
    if(!saved&&!failed){ui.wkDateErr='';render(false);toast('Enter at least one weight.');return;}
    commit(saved?(plural(saved,'weigh-in')+' saved'+(failed?', '+failed+' need attention':'')):failed+' need attention');
  },
  challenge(form){
    const v=formValues(form);
    const res=updateChallenge(data,{name:v.name,startDate:v.startDate,endDate:v.endDate});
    if(!res.ok){showErrors(form,res.errors);return;}
    delete data.challenge.demo;
    data.settings.showBody=!!form.elements.showBody.checked;
    commit('Settings saved');
  },
  measurement(form){
    const v=formValues(form),id=form.dataset.id;
    const res=updateMeasurement(data,id,{date:v.date,weight:v.weight},localToday());
    if(!res.ok){showErrors(form,res.errors);return;}
    closeModal();commit('Weigh-in updated');
  }
};
/* ---------- Admin sign-in ---------- */
function openLogin(){
  openModal('<div class="sec-head" style="margin:0"><h2>Admin sign in</h2><button class="btn ico" data-act="closeModal" aria-label="Close">'+icon('x',16)+'</button></div>'+
    '<p class="muted">Only the organiser needs to sign in. Participants can see everything else without an account.</p>'+
    '<form id="lform" data-form="login" novalidate><div class="fgrid" style="grid-template-columns:1fr">'+
    fld('email','lf-email','Email','<input id="lf-email" name="email" type="email" autocomplete="username" inputmode="email">')+
    fld('password','lf-pass','Password','<input id="lf-pass" name="password" type="password" autocomplete="current-password">')+
    '</div><div class="err" data-err="_form"></div><div class="foot" style="margin-top:12px"><button class="btn" type="button" data-act="closeModal">Cancel</button><button class="btn primary" type="submit">Sign in</button></div></form>');
}
submits.login=function(form){
  const v=formValues(form),email=String(v.email||'').trim(),errs={};
  if(!/^\S+@\S+\.\S+$/.test(email))errs.email='Enter your email address.';
  if(!v.password)errs.password='Enter your password.';
  if(Object.keys(errs).length){showErrors(form,errs);return;}
  if(!Cloud.au||!Cloud.auth){showErrors(form,{_form:'Sign-in isn’t ready yet. Try again in a moment.'});return;}
  const btn=form.querySelector('button[type=submit]');btn.disabled=true;
  Cloud.au.signInWithEmailAndPassword(Cloud.auth,email,v.password).then(function(){
    closeModal();go('admin');toast('Signed in');
  }).catch(function(e){
    btn.disabled=false;
    const c=e&&e.code,m=(c==='auth/invalid-credential'||c==='auth/wrong-password'||c==='auth/user-not-found'||c==='auth/invalid-login-credentials')?'The email or password is incorrect.':c==='auth/too-many-requests'?'Too many attempts. Wait a few minutes and try again.':c==='auth/network-request-failed'?'No connection. Check your internet and try again.':'Couldn’t sign in'+(c?' ('+c+')':'')+'.';
    showErrors(form,{_form:m});
  });
};
document.addEventListener('submit',e=>{const f=e.target.closest('form[data-form]');if(!f)return;e.preventDefault();if(f.dataset.form!=='login'&&!isAdmin())return;const h=submits[f.dataset.form];if(h)h(f);});

document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='q'){ui.q=t.value;renderResults();return;}
  const f=t.closest&&t.closest('#pform');
  if(f){
    const h=num(f.elements.heightCm.value),w=num(f.elements.startWeight.value),el=$('#bmiPrev');
    el.textContent=(!isNaN(h)&&!isNaN(w)&&h>=100&&h<=250&&w>0)?'Starting BMI '+f1(bmi1(w,h))+' ('+bmiCategory(bmi1(w,h))+')':'';
    return;
  }
  const c=t.closest&&t.closest('#cform');
  if(c){
    const s=c.elements.startDate.value;
    if(t.name==='duration'&&parseISO(s)!=null){const d=num(t.value);if(Number.isInteger(d)&&d>=1&&d<=730)c.elements.endDate.value=addDays(s,d-1);}
    else if((t.name==='endDate'||t.name==='startDate')&&parseISO(s)!=null&&parseISO(c.elements.endDate.value)!=null){
      if(t.name==='startDate'){const d=num(c.elements.duration.value);if(Number.isInteger(d)&&d>=1)c.elements.endDate.value=addDays(s,d-1);}
      else{const d=dayDiff(s,c.elements.endDate.value)+1;if(d>=1)c.elements.duration.value=d;}
    }
  }
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='wi-select'){ui.wiPid=t.value;render(false);}
  else if(t.id==='exSel'){$('#exText').value=exportContent(t.value);}
  else if(t.id==='wk-date'){ui.wkDate=t.value;}
});

/* ---------- Actions ---------- */
function go(view,reset){if(view==='admin'&&!isAdmin())view='dashboard';if(view==='profile'&&ui.view!=='profile')ui.prev=ui.view;ui.view=view;if(view==='leaderboard'||view==='participants'){}render(reset!==false);}
const actions={
  pickMe(t){ui.me=t.dataset.id;saveMe(ui.me);ui.q='';render(true);},
  meChange(){ui.me=null;saveMe(null);ui.q='';render(true);},
  authBtn(){
    if(Cloud.user){Cloud.au.signOut(Cloud.auth).then(function(){closeModal();ui.editPid=null;toast('Signed out');},function(){toast('Couldn’t sign out. Try again.');});}
    else openLogin();
  },
  nav(t){ui.q='';go(t.dataset.view);},
  profile(t){ui.pid=t.dataset.id;go('profile');},
  back(){ui.q='';go(ui.prev&&ui.prev!=='profile'?ui.prev:'participants');},
  tab(t){ui.tab=t.dataset.tab;render(false);},
  pgender(t){ui.pgender=t.dataset.g;render(false);},
  sort(t){const k=t.dataset.key;if(ui.sort.key===k)ui.sort.dir=ui.sort.dir==='asc'?'desc':'asc';else{ui.sort.key=k;ui.sort.dir=(k==='rank'||k==='name'||k==='gender')?'asc':'desc';}render(false);},
  showAll(){ui.showAll=!ui.showAll;render(false);},
  adminTab(t){ui.adminTab=t.dataset.tab;ui.editPid=null;render(false);},
  editP(t){ui.editPid=t.dataset.id;ui.adminTab='participants';render(false);const f=$('#pform');if(f){f.scrollIntoView({behavior:'smooth',block:'center'});}},
  cancelEdit(){ui.editPid=null;render(false);},
  delP(t){
    const r=D.rows.find(x=>x.id===t.dataset.id);if(!r)return;
    confirmModal('Delete '+r.name+'?','This removes the participant and all '+plural(r.count,'weigh-in')+'. This can’t be undone.','Delete participant',()=>{deleteParticipant(data,r.id);if(ui.editPid===r.id)ui.editPid=null;commit('Deleted '+r.name);},true);
  },
  wiFor(t){ui.wiPid=t.dataset.id;ui.adminTab='weighins';go('admin');},
  editM(t){openEditMeasurement(t.dataset.id);},
  delM(t){
    const m=data.measurements.find(x=>x.id===t.dataset.id);if(!m)return;
    confirmModal('Delete this weigh-in?','The '+fmtDate(m.date)+' weigh-in of '+f1(m.weight)+' kg will be removed and rankings will update.','Delete weigh-in',()=>{const r=deleteMeasurement(data,m.id);if(r.ok)commit('Weigh-in deleted');else toast(r.error);},true);
  },
  export(){openExport();},
  copyCsv(){
    const ta=$('#exText');
    const fallback=()=>{ta.focus();ta.select();toast('Press Ctrl+C or Cmd+C to copy');};
    try{navigator.clipboard.writeText(ta.value).then(()=>toast('CSV copied'),fallback);}catch(e){fallback();}
  },
  closeModal(t,e){if(t.classList.contains('scrim')&&e.target!==t)return;closeModal();},
  modalConfirm(){const fn=modalAction;closeModal();if(fn)fn();},
  demoRemove(){
    const n=data.participants.filter(p=>p.demo).length;
    confirmModal('Remove demo data?',plural(n,'demo participant')+' and their weigh-ins will be deleted. Participants you added yourself stay.','Remove demo data',()=>{
      const keep=new Set(data.participants.filter(p=>!p.demo).map(p=>p.id));
      data.participants=data.participants.filter(p=>keep.has(p.id));data.measurements=data.measurements.filter(m=>keep.has(m.pid));
      if(data.challenge.demo)data.challenge=blankChallenge(localToday());
      ui.pid=null;ui.editPid=null;ui.wiPid=null;commit('Demo data removed');
    },true);
  },
  demoReset(){
    confirmModal('Reset to demo data?','Everything is replaced with fresh sample data, including participants you added.','Reset to demo data',()=>{data=buildDemo(localToday());ui.pid=null;ui.editPid=null;ui.wiPid=null;ui.wkVals={};ui.wkErr={};commit('Demo data restored');},true);
  },
  wipeAll(){
    confirmModal('Delete all data?','All participants, weigh-ins and challenge settings are removed. This can’t be undone.','Delete everything',()=>{data={schema:1,challenge:blankChallenge(localToday()),settings:{showBody:true},participants:[],measurements:[]};ui.pid=null;ui.editPid=null;ui.wiPid=null;commit('All data deleted');},true);
  }
};
['adminTab','editP','cancelEdit','delP','wiFor','editM','delM','export','demoRemove','demoReset','wipeAll'].forEach(function(k){
  const fn=actions[k];
  actions[k]=function(t,e){if(!isAdmin())return;fn(t,e);};
});
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');if(!t)return;
  const a=actions[t.dataset.act];if(a)a(t,e);
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#modalRoot').firstChild)closeModal();});

let lastW=0,raf=0;
if(window.ResizeObserver){new ResizeObserver(()=>{const w=main.clientWidth;if(Math.abs(w-lastW)<8)return;lastW=w;cancelAnimationFrame(raf);raf=requestAnimationFrame(drawCharts);}).observe(main);}

if(Cloud.on)cloudInit();
render(true);
})();
</script>

</body></html>
